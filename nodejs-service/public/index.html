<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A clean calculator powered by Node.js and Python integration.">
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="status-tray">
    <div class="status-badge" id="nodebadge">
        <span class="badge-dot" id="nodeDot"></span>
        Node.js
    </div>
    <div class="status-badge" id="pybadge">
        <span class="badge-dot" id="pyDot"></span>
        Python
    </div>
</div>

<div class="calculator">
    <div class="display">
        <div class="expression" id="expression"></div>
        <div class="result" id="result">0</div>
    </div>

    <div class="grid">
        <button class="adv fn" id="btn-mod"  onclick="setOp('modulo')">mod</button>
        <button class="adv fn" id="btn-pow"  onclick="setOp('power')">x<sup style="font-size:10px">y</sup></button>
        <button class="adv fn" id="btn-sqrt" onclick="doSqrt()">
            <svg width="20" height="18" viewBox="0 0 28 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <!-- tick going down then up (radical symbol) -->
                <polyline points="2,11 6,18 11,2 27,2"/>
                <!-- overline on top of the radicand -->
                <line x1="11" y1="2" x2="27" y2="2"/>
            </svg>
        </button>
        <button class="adv fn" id="btn-hist" onclick="toggleHistory()" title="History">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
        </button>

        <div class="row-divider"></div>

        <button class="fn clear" id="btn-ac"   onclick="clearAll()">AC</button>
        <button class="fn"       id="btn-sign" onclick="toggleSign()">+/−</button>
        <button class="fn"       id="btn-pct"  onclick="percent()">%</button>
        <button class="op"       id="btn-div"  onclick="setOp('divide')">÷</button>

        <button id="btn-7" onclick="digit('7')">7</button>
        <button id="btn-8" onclick="digit('8')">8</button>
        <button id="btn-9" onclick="digit('9')">9</button>
        <button class="op" id="btn-mul" onclick="setOp('multiply')">×</button>

        <button id="btn-4" onclick="digit('4')">4</button>
        <button id="btn-5" onclick="digit('5')">5</button>
        <button id="btn-6" onclick="digit('6')">6</button>
        <button class="op" id="btn-sub" onclick="setOp('subtract')">−</button>

        <button id="btn-1" onclick="digit('1')">1</button>
        <button id="btn-2" onclick="digit('2')">2</button>
        <button id="btn-3" onclick="digit('3')">3</button>
        <button class="op" id="btn-add" onclick="setOp('add')">+</button>

        <button class="zero" id="btn-0"  onclick="digit('0')">0</button>
        <button              id="btn-dot" onclick="decimal()">.</button>
        <button class="equals" id="btn-eq" onclick="calculate()">=</button>
    </div>
</div>

<div class="history-panel" id="historyPanel">
    <div class="history-header">
        <h2>History</h2>
        <div class="history-header-actions">
            <button class="icon-btn danger" id="btn-clear-hist" onclick="clearHistory()" title="Clear history">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/>
                </svg>
            </button>
            <button class="icon-btn" id="btn-close-hist" onclick="toggleHistory()" title="Close">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                    <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                </svg>
            </button>
        </div>
    </div>
    <div class="history-list" id="historyList"></div>
</div>

<div class="overlay" id="overlay" onclick="toggleHistory()"></div>

<script src="app.js"></script>
</body>
</html>
